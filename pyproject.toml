[build-system]
requires = ["setuptools~=69.0", "wheel~=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TeleClaude"
version = "0.6.1"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Maurice Faber", email = "maurice@instrukt.ai" }]
description = "Control terminal sessions on multiple computers remotely via Telegram"
readme = "README.md"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Shells",
]
keywords = ["telegram", "terminal", "tmux", "remote-control"]
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.5",
    "discord.py>=2.4.0",
    "openai>=2.6.1",
    "anthropic>=0.42.0",
    "aiosqlite>=0.21.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.16",
    "greenlet>=3.3.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "aiofiles>=25.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "redis>=5.0.0",
    "psutil>=5.9.0",
    "packaging>=24.0",
    "instrukt-ai-logger @ git+https://github.com/InstruktAI/python-logger.git@v0.3.5",
    "telegramify-markdown==0.5.4",
    "GitPython>=3.1.0",
    "nest-asyncio>=1.6.0",
    "aiohttp>=3.9.0",
    "dateparser>=1.2.0",
    "youtube-transcript-api>=1.0.0",
    "munch>=4.0.0",
    "httpx>=0.28.0",
    "websockets>=12.0",
    "python-frontmatter>=1.1.0",
    "elevenlabs>=2.31.0",
    "watchdog>=4.0.0",
    "pathspec>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "textual>=1.0.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "pyresidfp>=0.17.0",
    "py65emu>=0.1.0",
    "sounddevice>=0.5.0",
    "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "phonemizer-fork>=3.3.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.8.0",
    "aiohttp>=3.9.0",
    "coverage[toml]>=7.4.0",
    "ruff>=0.12.0",
    "pyright>=1.1.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]

[tool.uv.sources]
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio.git", branch = "main" }

[tool.setuptools.packages.find]
where = ["."]
include = ["teleclaude*"]

[project.urls]
homepage = "https://github.com/InstruktAI/TeleClaude"
"Source Code" = "https://github.com/InstruktAI/TeleClaude"
"Bug Tracker" = "https://github.com/InstruktAI/TeleClaude/issues"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "venv", ".mypy_cache", ".pytest_cache", "coverage"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # only preview rules in extend-select are active
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "C90",  # mccabe complexity
  "B",    # flake8-bugbear (real bugs: mutable defaults, broad exceptions, unreachable code)
  "UP",   # pyupgrade (modernize syntax for target Python version)
  "RUF",  # ruff-specific rules (unused noqa, mutable class vars, ambiguous unicode)
]
ignore = [
  "E501",   # line-too-long (formatter handles this in practice)
  "B008",   # function-call-in-default-argument — false positive on FastAPI Depends()
  "UP007",  # non-pep604-annotation — Optional[X] is still readable and widely used
  # guard: ratchet-down — temporarily ignored due to existing tech debt, re-enable as violations are fixed
  "UP042",  # replace-str-enum — 37 violations, needs StrEnum migration pass
  "RUF012", # mutable-class-default — 30 violations, needs ClassVar annotation pass
  "RUF005", # collection-literal-concatenation — 13 violations, cosmetic
  "RUF006", # asyncio-dangling-task — 9 violations, needs careful manual review
  "B905",   # zip-without-explicit-strict — 9 violations, needs review
]
extend-select = [
  "F403",    # import * used; unable to detect undefined names
  "F405",    # name may be undefined, or defined from star imports
  "PLC0415", # import-outside-top-level (preview) — enforced via guardrail allowlist
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "F841", "E402"]  # Allow unused variables and sys.path imports in tests
"scripts/**" = ["E402"]  # Scripts need sys.path manipulation before imports
"jobs/**" = ["E402"]  # Jobs need sys.path manipulation before imports
"cron/**" = ["E402"]  # Cron entrypoints need sys.path manipulation before imports
"teleclaude/helpers/agent_cli.py" = ["E402"]  # Needs sys.path for standalone execution
# guard: ratchet-down — B904 (raise from), B023 (loop vars), E402 (import order), RUF001-003 (unicode)
"teleclaude/cli/telec/**" = ["B904", "E402"]
"teleclaude/cli/tui/animations/base.py" = ["RUF001", "RUF002", "RUF003"]
"teleclaude/hooks/receiver/__main__.py" = ["E402"]
# Startup-boundary and guarded imports — allowlisted for PLC0415
"teleclaude/daemon_event_platform.py" = ["PLC0415"]
"teleclaude/core/adapter_client/_client.py" = ["PLC0415"]
"teleclaude/helpers/youtube_helper/_utils.py" = ["PLC0415"]  # try/except guarded import
"teleclaude/adapters/base_adapter.py" = ["B027"]  # Intentional non-abstract base methods
"teleclaude/cli/config_cli.py" = ["B904"]
"teleclaude/cli/tool_client.py" = ["B904"]
"teleclaude/cli/tool_commands/**" = ["B904"]
"teleclaude/core/integration/lease.py" = ["B904"]
"teleclaude/core/tmux_bridge.py" = ["B904"]
"teleclaude/core/codex_prompt_submit.py" = ["B023", "RUF001", "RUF002", "RUF003"]
"teleclaude/daemon.py" = ["E402", "PLC0415"]  # Import timing instrumentation + startup-boundary lazy imports
"teleclaude/chiptunes/sid_cpu.py" = ["RUF001", "RUF002", "RUF003"]
"teleclaude/chiptunes/sid_parser.py" = ["RUF001", "RUF002", "RUF003"]
"teleclaude/cli/tui/animations/sprites/cars.py" = ["RUF001", "RUF002", "RUF003"]
"tools/verify_deploy.py" = ["RUF001", "RUF002", "RUF003", "B006", "UP035"]
"tools/lint/markdown.py" = ["E402"]

[tool.mypy]
# MAXIMUM STRICTNESS - No Any, no untyped dict/list, no isinstance abuse
python_version = "3.12"
files = ["teleclaude", "jobs", "scripts", "tests", "tools", "*.py"]
exclude = ["^venv/", "^.venv/", "^trees/"]
follow_imports = "silent"  # TODO: Revisit - changed from "skip" to allow pydantic BaseModel resolution
enable_error_code = ["literal-required"]

# Enable ALL strict mode flags
strict = true
strict_equality = true
no_strict_optional = true

# Additional strictness beyond --strict (ban ALL forms of Any)
# The disallow_any_* flags below strict are disabled — third-party libs
# (aiosqlite, httpx, pydantic, curses) propagate Any unavoidably. Enabling
# these creates thousands of noise errors that mask real type bugs.
# strict = true already provides: disallow_any_generics, warn_return_any,
# disallow_untyped_defs, and all other meaningful strict checks.
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false

# Import handling
disable_error_code = [
  "import-untyped",  # Still allow importing untyped third-party libs
  "func-returns-value",  # Allow functions that only return None (handlers, etc.)
  "no-redef", # Disable redefinition error, due to unreliable behavior in if/elif scopes
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["arg-type", "attr-defined", "assignment", "call-overload", "has-type", "misc", "no-any-return", "no-untyped-call", "return-value", "type-arg", "var-annotated"]

[[tool.mypy.overrides]]
module = [
  "teleclaude.adapters.telegram_adapter",
  "teleclaude.hooks.receiver",
  "teleclaude.hooks.receiver.*",
  "teleclaude.config",
]
disallow_any_expr = false
disallow_any_unimported = false
disallow_any_explicit = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["teleclaude.transport.redis_transport", "teleclaude.transport.redis_transport.*"]
# Redis client returns Any types that propagate.
disable_error_code = ["misc", "no-any-return", "attr-defined", "explicit-any", "arg-type", "assignment", "override"]

[[tool.mypy.overrides]]
module = "teleclaude.api_server"
# FastAPI decorators and Pydantic models introduce Any-typed boundaries.
disable_error_code = ["misc", "assignment", "arg-type"]

[[tool.mypy.overrides]]
module = [
  "teleclaude.core.command_handlers", "teleclaude.core.command_handlers.*",
  "teleclaude.core.models", "teleclaude.core.models.*",
  "teleclaude.core.db", "teleclaude.core.db.*",
]
# Core data layer: mixin patterns, dynamic typing, SQLModel/SQLAlchemy Any propagation.
# Pre-existing suppression extended to subpackages; no new violations added.
disable_error_code = ["explicit-any", "misc", "arg-type", "assignment", "attr-defined", "no-any-return", "call-overload", "unused-ignore", "return-value", "return", "operator"]

[[tool.mypy.overrides]]
module = [
  "teleclaude.adapters.base_adapter",
  "teleclaude.adapters.ui_adapter",
  "teleclaude.adapters.telegram_adapter",
  "teleclaude.adapters.discord_adapter",
  "teleclaude.adapters.whatsapp_adapter",
]
# Adapter mixin diamond inheritance produces MRO definition conflicts that
# cannot be suppressed with inline comments on class definitions.
disable_error_code = ["misc", "explicit-any", "arg-type", "override"]

[[tool.mypy.overrides]]
module = "teleclaude.hooks.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "teleclaude.cli.tui.*"
# Curses module doesn't have complete type stubs; stdscr methods return Any.
disable_error_code = ["misc", "explicit-any", "arg-type", "unused-ignore", "attr-defined", "assignment", "call-overload", "has-type", "no-any-return", "index", "return-value", "type-arg", "no-untyped-call", "no-untyped-def", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = "teleclaude.cli.api_client"
# httpx resp.json() returns Any.
disable_error_code = ["misc", "no-any-return"]

[[tool.mypy.overrides]]
module = "teleclaude.api.*"
# FastAPI decorators and Pydantic BaseModel have internal Any types.
disable_error_code = ["misc", "explicit-any", "arg-type", "unused-ignore"]

[tool.pyproject-fmt]
indent = 4
keep_full_version = false
max_supported_python = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 1
addopts = [
  "-v",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "-n", "4",
  "-m", "not expensive",
]
markers = [
  "unit: Unit tests (fast, isolated, mocked)",
  "functional: Real API/auth/DB chain tests with local harnessed dependencies",
  "integration: Integration tests (slower, real components)",
  "expensive: Tests that call real LLM APIs (excluded from default runs)",
  "timeout: Test timeout marker",
]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::telegram.warnings.PTBDeprecationWarning",
  "ignore:The default datetime adapter is deprecated:DeprecationWarning:aiosqlite",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore::pytest.PytestUnhandledThreadExceptionWarning",
  "ignore:.*datetime.utcnow.*:DeprecationWarning",
]

[tool.test-mapping]
exclude = [
    "teleclaude/core/metadata.py",       # Pure Pydantic model, no logic
    "teleclaude/logging_config.py",       # Delegates to instrukt_ai_logging
]
# guard: ratchet-down — centrally classified tests with no honest single teleclaude/** source companion
orphan-exclude = [
    "tests/unit/adapters/discord/test_headless_title.py",  # Cross-module: Discord title prefix spans channel_ops.py and Session metadata.
    "tests/unit/adapters/telegram/test_send_message_topic_guard.py",  # Cross-module: Telegram topic guard spans message_ops.py and adapter metadata.
    "tests/unit/cli/telec/handlers/test_todo_artifacts.py",  # Deferred split: todo artifact CLI assertions share handlers/todo.py with other specs.
    "tests/unit/cli/telec/handlers/test_todo_lifecycle_dump_specs.py",  # Deferred split: dump event contract spans handlers/todo.py and event envelope.
    "tests/unit/cli/telec/test_surface_export.py",  # Deferred split: surface export assertions belong with occupied cli/telec/surface.py companion.
    "tests/unit/cli/tui/test_resource_cleanup.py",  # Cross-module: cleanup spans TelecApp, app_media state, and SessionsView resources.
    "tests/unit/config/test_config_independent_schemas.py",  # Cross-module: config schema isolation spans loader, schema, context, and git helper.
    "tests/unit/core/db/test_outbox_isolation.py",  # Cross-module: outbox isolation spans Db, connection_factory, hook receiver, and daemon outbox.
    "tests/unit/core/db/test_receiver_write_elimination.py",  # Cross-module: receiver write elimination spans hook receiver, db paths, and daemon outbox.
    "tests/unit/core/db/test_typed_results.py",  # Cross-module: typed result contract spans todos_db mixins and mirrors store.
    "tests/unit/core/integration/test_auto_enqueue.py",  # Cross-module: integration auto-enqueue spans step_functions readiness checks and TodosDb state.
    "tests/unit/core/integration/test_queue_transitions.py",  # Cross-module: queue transition contract spans IntegrationQueue and readiness projection keys.
    "tests/unit/core/integration/test_step_delivery_bookkeeping.py",  # Cross-module: delivery bookkeeping spans checkpoint, readiness projection, and step_functions.
    "tests/unit/core/integration/test_worktree_guards.py",  # Cross-module: integration worktree guard validates step_functions against worktree state.
    "tests/unit/core/next_machine/test_authoritative_phase_clearing.py",  # Cross-module: phase clearing spans lifecycle normalization and TodoState data.
    "tests/unit/core/next_machine/test_authoritative_phase_fields_specs.py",  # Deferred split: authoritative phase specs span CLI todo handler, state_io, and types.
    "tests/unit/core/next_machine/test_prepare_lifecycle_pair_model_specs.py",  # Deferred split: prepare lifecycle specs span lifecycle, output formatting, state_io, and worktrees.
    "tests/unit/core/next_machine/test_stamp_verdict.py",  # Cross-module: verdict stamping spans state_io persistence and TodosDb/TodoState.
    "tests/unit/core/test_channel_metadata_cleanup.py",  # Cross-module: metadata cleanup spans session command handlers and command metadata models.
    "tests/unit/core/test_command_wrapping.py",  # Cross-module: command wrapping spans API sessions, auth identity, command handlers, and command types.
    "tests/unit/core/test_db.py",  # Package-boundary: core/db package public session-principal contract has no single module companion.
    "tests/unit/core/test_documentation_deliverables.py",  # Cross-module: documentation deliverable checks span generated artifacts and repository docs.
    "tests/unit/core/test_domain_events.py",  # Cross-module: domain event emission spans API routes, command handlers, event bus, and operations.
    "tests/unit/core/test_metadata_driven_dispatch.py",  # Cross-module: metadata dispatch spans Redis messaging metadata and command type models.
    "tests/unit/core/test_output_pipeline_design_spec.py",  # Cross-module: output pipeline design spans UI adapter, output poller, and polling coordinator.
    "tests/unit/core/test_receipt_operations.py",  # Cross-module: receipt operations span todo API routes, caller identity, and operations service.
    "tests/unit/core/test_todo_watcher_removal.py",  # Deferred decision: stale watcher-removal spec has no import owner and must be rehomed or retired.
    "tests/unit/core/test_working_slug_derivation.py",  # Cross-module: working slug derivation spans session handlers and create-session command types.
    "tests/unit/core/todos_db/test_mutation_callback.py",  # Cross-module: mutation callback spans state_io singleton access and TodosDb hooks.
    "tests/unit/core/todos_db/test_sqlalchemy_engine.py",  # Package-boundary: todos_db package engine contract is exposed through package-level TodosDb.
    "tests/unit/events/cartridges/test_todo_lifecycle_router_specs.py",  # Deferred decision: router spec imports only envelope types; ownership needs event-router split.
    "tests/unit/events/schemas/test_todo_dumped_kind_specs.py",  # Cross-module: dumped-kind schema spans event catalog, envelope, and software-development schema registration.
    "tests/unit/hooks/checkpoint/test__init__.py",  # Package-boundary: hooks.checkpoint public exports compose checkpoint messages across helper internals.
    "tests/unit/hooks/receiver/test__init__.py",  # Package-boundary: hooks.receiver public entrypoints span receiver package helpers and database paths.
    "tests/unit/install/test_git_wrapper_permissions.py",  # Mapper-gap: shell wrapper under teleclaude/install/wrappers has no Python source companion.
    "tests/unit/jobs/test_dependency_upgrade.py",  # Mapper-gap: jobs/dependency_upgrade.py is outside current teleclaude/** mapper roots.
    "tests/unit/jobs/test_project_backup.py",  # Mapper-gap: jobs/project_backup.py is outside current teleclaude/** mapper roots.
    "tests/unit/jobs/test_session_memory_extraction.py",  # Mapper-gap: jobs/session_memory_extraction.py is outside current teleclaude/** mapper roots.
    "tests/unit/jobs/test_youtube_scraper.py",  # Mapper-gap: jobs/youtube_scraper.py is outside current teleclaude/** mapper roots.
    "tests/unit/mirrors/test_sqlalchemy_engine.py",  # Cross-module: mirror SQLAlchemy contract spans mirrors.store records and tombstone helpers.
    "tests/unit/resource_validation/test__init__.py",  # Package-boundary: resource_validation package export contract has no single module companion.
    "tests/unit/resource_validation/test_activation_trigger_validation_spec.py",  # Cross-module: activation trigger validation spans package models and snippet validator.
    "tests/unit/resource_validation/test_unified_severity_spec.py",  # Cross-module: severity contract spans resource_validation and sync-facing model usage.
    "tests/unit/scripts/test_distribute.py",  # Mapper-gap: scripts/distribute.py is outside current teleclaude/** mapper roots.
    "tests/unit/scripts/test_release_changelog.py",  # Mapper-gap: scripts/release_changelog.py is outside current teleclaude/** mapper roots.
    "tests/unit/scripts/test_release_consolidator.py",  # Mapper-gap: scripts/release_consolidator.py is outside current teleclaude/** mapper roots.
    "tests/unit/session_scoping/test__extractors.py",  # Package-boundary: _extractors package dispatch spans claude, codex, and gemini extractors.
    "tests/unit/session_scoping/test__init__.py",  # Package-boundary: session_scoping public API re-exports _api and _types contracts.
    "tests/unit/test_asyncio_task_naming.py",  # Cross-module: asyncio task naming checks runtime task creation policy across daemon flows.
    "tests/unit/test_daemon_headless_pipeline.py",  # Cross-module: headless daemon pipeline spans config CLI, hook outbox, docs handler, and identity.
    "tests/unit/test_distribute.py",  # Mapper-gap: legacy importlib coverage for scripts/distribute.py remains outside mapper roots.
    "tests/unit/test_no_stale_todo_fs_refs.py",  # Cross-module: stale todo filesystem reference guard scans repository markdown artifacts.
    "tests/unit/test_pydantic_to_typescript_codegen.py",  # Deferred decision: unsafe move; codegen spec currently fails when run directly.
    "tests/unit/test_todo_from_main.py",  # Deferred decision: unsafe move; from-main scaffold spec currently fails when run directly.
    "tests/unit/tools/lint/test_guardrails.py",  # Mapper-gap: tools/lint/guardrails.py is outside current teleclaude/** mapper roots.
    "tests/unit/tools/lint/test_markdown.py",  # Mapper-gap: tools/lint/markdown.py is outside current teleclaude/** mapper roots.
    "tests/unit/tools/test_migration.py",  # Mapper-gap: Makefile/tool migration checks target repository tooling outside teleclaude/** roots.
    "tests/unit/tools/test_session_scope.py",  # Mapper-gap: session scope tooling checks repository scripts outside teleclaude/** roots.
    "tests/unit/tools/test_shell_scoping.py",  # Mapper-gap: shell scoping checks tool wrappers outside teleclaude/** roots.
    "tests/unit/tools/test_update_third_party_frontmatter.py",  # Mapper-gap: tools/update_third_party_frontmatter.py is outside current teleclaude/** mapper roots.
    "tests/unit/transport/redis_transport/test_redis_wire_format_typed_fields.py",  # Cross-module: Redis wire format spans metadata models, snapshots, and transport.
    "tests/unit/transport/redis_transport/test_target_computer_named_field.py",  # Cross-module: target-computer wire field spans command mapper, metadata models, and transport.
]

[tool.coverage.run]
source = ["teleclaude"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.json]
output = "coverage/coverage.json"


[tool.uv]
override-dependencies = [
  "attrs<26",
  "confection<1",
  "starlette<1",
  "tzdata<2026",
  "weasel<1",
]
