    "teleclaude/core/metadata.py",       # Pure Pydantic model, no logic
    "teleclaude/core/origins.py",        # Enum constants only; covered through API/TTS consumers
    "teleclaude/core/protocols.py",      # Protocol contract only
    "teleclaude/core/session_start_messages.py", # Constants-only prompt pool
    "teleclaude/core/todos_db/_rows.py", # Typed row shapes only
    "teleclaude/events/domains/creative_production/handlers/asset_lifecycle/handler.py", # Trivial pass-through handler
    "teleclaude/events/domains/creative_production/handlers/review_gatekeeper/handler.py", # Trivial pass-through handler
