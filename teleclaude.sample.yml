# teleclaude.yml
# project_slug: your-project-slug
# project_name: Your Project
# frontend_root: frontend  # optional layout override: directory containing TypeScript/frontend project
# External webhook ingress is configured on the runtime node in `config.yml`:
# computer.is_ingress_node: true
# A same-host reverse proxy forwards only the webhook path prefix to the
# localhost API server; the API server does not LAN-bind.
# business:
#   # Domains this project owns and publishes global docs for, served from
#   # docs/global/<domain>/. Each domain has exactly one owner across all
#   # registered projects; a split is blocked at `telec sync`.
#   publishes:
#     - software-development
#
# Runtime adapter settings belong in `config.yml`:
# discord:
#   enabled: false
#   token: ${DISCORD_BOT_TOKEN}
#   guild_id: ${DISCORD_GUILD_ID}
#   help_desk_channel_id: ${DISCORD_HELP_DESK_CHANNEL_ID}
#
# jobs:
#   # Scrapes recent videos for tag-filtered subscribed channels (script job).
#   youtube_scraper:
#     category: system
#     when:
#       at: '06:00'
#     script: jobs/youtube_scraper.py
#
#   # Tags unclassified channels in each subscriber's youtube.csv (script job).
#   youtube_sync_subscriptions:
#     category: system
#     when:
#       at: '06:00'
#     script: jobs/youtube_sync_subscriptions.py
#
