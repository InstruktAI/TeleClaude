# Sample configuration file for TeleClaude. Copy this to `config.yml` and edit as needed.
# expands ${ENV_VAR} from the environment after sourcing .env, allowing to keep secrets out of the config file.

computer:
  name: Mac # Unique computer identifier for multi-computer MCP communication
  role: development # Computer role: development, production, testing, api-server, etc. (shown in MCP computer list)
  is_master: true # Master computer in a multi-computer mesh; exactly one. Provisions shared Discord channels (Operations, Help Desk, Team); non-masters resolve them by name.
  timezone: Europe/Amsterdam # Timezone for timestamps (default: Europe/Amsterdam)
  # user, default_working_dir, help_desk_dir, and host are derived at runtime
  # (system login, project dir, help-desk subdir, detected LAN IP) — not editable here.
  # Trusted directories
  # Format: { name: "identifier", desc: "purpose description", path: "/absolute/path" }
  trusted_dirs:
    - name: Workspace
      desc: Project workspace
      path: ${HOME}/Workspace

# Redis Configuration (essential for TeleClaude operation)
redis:
  url: ${REDIS_URL}
  password: ${REDIS_PASSWORD}
  # max_connections: 100
  # socket_timeout: 60
  # message_stream_maxlen: 10000
  # output_stream_maxlen: 10000
  # output_stream_ttl: 3600

# Telegram admin adapter for mobile interaction with the platform.
telegram:
  enabled: false
  # Bot token.
  bot_token: ${TELEGRAM_BOT_TOKEN}

# Admin adapter that houses the administration of ALL computer and their projects,
# So highly recommended to enable it for mobile interaction with the platform.
discord:
  enabled: false
  # Bot token.
  token: ${DISCORD_BOT_TOKEN}
  # Guild (server) ID.
  guild_id: ${DISCORD_GUILD_ID}
  # All channel/category IDs below are auto-provisioned on startup.
  # The master computer (computer.is_master) creates the shared structure —
  # Operations, Help Desk (Customer Sessions, Escalations), and Team. Non-master
  # computers resolve those by name but never create them. Every computer always
  # creates its own per-computer "Projects - {name}" category and forums.
  # Provisioned IDs are persisted here. Do not edit manually.

whatsapp:
  # Customer/public facing Whatsapp business channel configuration. Disable if no need for public Whatsapp helpdesk/member-pa, or if this is not the master computer.
  enabled: false
  phone_number_id: ${WHATSAPP_PHONE_NUMBER_ID}
  access_token: ${WHATSAPP_ACCESS_TOKEN}
  webhook_secret: ${WHATSAPP_WEBHOOK_SECRET}
  verify_token: ${WHATSAPP_VERIFY_TOKEN}
  template_name: ${WHATSAPP_TEMPLATE_NAME}
  template_language: en_US

email:
  # Outbound email (SMTP relay). Enable to send member invites etc. by email.
  # When disabled or unconfigured, email is simply not sent (callers gate on availability).
  # Credentials live in .env: SMTP_USERNAME, SMTP_KEY, EMAIL_FROM (+ optional SMTP_RELAY, EMAIL_REPLYTO).
  enabled: false

agents:
  default: claude
  claude:
    enabled: true
  gemini:
    enabled: true
  codex:
    enabled: true

# Speech-to-Text Configuration
stt:
  enabled: true
  service_priority:
    - parakeet # Local MLX (free, private, fast on Apple Silicon)
    - openai # Cloud Whisper API (fallback) that needs OPENAI_API_KEY env var set
  services:
    parakeet:
      enabled: true
      # HuggingFace repo id or absolute path to a compatible MLX model directory.
      # Example local path:
      # ${HOME}/.cache/lm-studio/models/mlx-community/parakeet-tdt-0.6b-v3
      model: mlx-community/parakeet-tdt-0.6b-v3
    openai:
      enabled: true

# Text-to-Speech Configuration
tts:
  enabled: false
  service_priority:
    - voxcpm # Local MLX, greate voice quality. Size in mem:
    - qwen3 # Local MLX, fun to test as has weird voices
    - openai
    - elevenlabs
    - macos
    - pyttsx3
  events:
    session_start:
      enabled: true
    agent_stop:
      enabled: true
  services:
    voxcpm:
      enabled: true
      # Optional: local model path or HF repo id.
      # Example local path:
      # ${HOME}/.cache/lm-studio/models/mlx-community/voxcpm1.5
      model: mlx-community/voxcpm1.5
      params:
        temperature: 0.5
        speed: 1.1
        cfg_scale: 3.0
        ddpm_steps: 15
      voices:
        - name: narrator
          params:
            temperature: 0.1
            speed: 0.9
        - name: reporter
          params:
            temperature: 0.1
            speed: 1.1
        - name: excited
          params:
            temperature: 0.1
            speed: 1.2
    kokoro:
      enabled: true
      model: mlx-community/Kokoro-82M-bf16
      voices:
