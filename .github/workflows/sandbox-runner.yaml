name: Sandbox Runner Image

on:
  workflow_run:
    # prettier-ignore
    workflows: ["Lint"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/instruktai/teleclaude/sandbox-runner

jobs:
  build-push:
    name: Build and Push Sandbox Runner
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      HEAD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_COMMIT }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'

      - name: Check for relevant changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        run: uv run python -m tools.ci.detect_sandbox_changes

      - name: Build and push image
        if: steps.changes.outputs.changed != 'false'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tools.ci.publish_sandbox_image --source-revision "$HEAD_COMMIT"
