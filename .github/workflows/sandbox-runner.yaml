name: Sandbox Runner Image

on:
  workflow_run:
    # prettier-ignore
    workflows: ["Lint and Test"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/instruktai/teleclaude/sandbox-runner

jobs:
  build-push:
    name: Build and Push Sandbox Runner
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          HEAD_COMMIT: ${{ github.event.workflow_run.head_commit.id }}
        run: uv run python -m tools.ci.detect_sandbox_changes

      - name: Build and push image
        if: steps.changes.outputs.changed != 'false'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tools.ci.publish_sandbox_image
