name: Release Automation
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        required: true
        default: dry-run
        options: [dry-run, release, seed, reseed, retry, cancel]
      version:
        description: Explicit stable version for a manual release or dry-run
        type: string
        required: false
      seed_operation_id:
        description: Stable idempotency key for an explicit Codex seed or reseed
        type: string
        required: false
      seed_ciphertext:
        description: Base64 age-encrypted Codex auth JSON for an explicit seed or reseed
        type: string
        required: false

concurrency:
  group: release-auth-stream-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_PUBLICATION_ENABLED: 'false'
  UV_VERSION: '0.13.0'
  UV_NO_SYNC: '1'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  CODEX_CLI_VERSION: '0.162.1'
  CLAUDE_CODE_VERSION: '2.1.259'
  AGE_VERSION: 'v1.3.2'

jobs:
  recover-publication:
    name: Recover any partial proved publication
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      recovered: ${{ steps.recover.outputs.recovered_publication }}
      recovered_release_url: ${{ steps.recover.outputs.release_url }}
      publication_enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked controller dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --group dev --no-install-project
      - name: Read checked-in publication activation
        id: activation
        run: echo "enabled=$RELEASE_PUBLICATION_ENABLED" >> "$GITHUB_OUTPUT"
      - name: Reconcile pending receipts before source capture
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tools.ci.release_stage recover-publication --output-directory "$RUNNER_TEMP/release-recovery"
      - name: Detect retained recovery files
        id: recovery_files
        if: always()
        shell: bash
        run: tools/ci/detect_release_artifacts.sh glob "$RUNNER_TEMP/release-recovery/recovered-*.json"
      - name: Retain recovered publication receipts
        if: ${{ always() && steps.recovery_files.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery/recovered-*.json
          if-no-files-found: error
          retention-days: 30

  seed-auth:
    name: Explicit Codex subscription seed or reseed
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        github.event_name == 'workflow_dispatch' &&
        (inputs.operation == 'seed' || inputs.operation == 'reseed')
      }}
    needs: [recover-publication]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned age and locked controller dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --group dev --no-install-project
          uv run python -m tools.ci.install_age
      - name: Validate and materialize explicit encrypted seed
        id: seed
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_AUTH_AGE_IDENTITY: ${{ secrets.CODEX_AUTH_AGE_IDENTITY }}
          CODEX_AUTH_SEED_CIPHERTEXT: ${{ inputs.seed_ciphertext }}
          RELEASE_SEED_OPERATION_ID: ${{ inputs.seed_operation_id }}
        run: |
          args=(--output-directory "$RUNNER_TEMP/release-seed/seed-artifact")
          if [ "$RELEASE_OPERATION" = 'reseed' ]; then args+=(--reseed); fi
          uv run python -m tools.ci.release_stage seed-codex "${args[@]}"
      - name: Upload immutable encrypted seed
        id: seed_upload
        if: ${{ steps.seed.outputs.seed_already_complete != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.seed.outputs.seed_artifact_name }}
          path: ${{ runner.temp }}/release-seed/seed-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Confirm finalized seed identity
        if: ${{ steps.seed_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage confirm-seed
          --output-directory "$RUNNER_TEMP/release-seed/seed-artifact"
          --artifact-id "${{ steps.seed_upload.outputs.artifact-id }}"
          --digest "${{ steps.seed_upload.outputs.artifact-digest }}"
      - name: Remove seed controller material
        if: always()
        run: >-
          uv run python -m tools.ci.release_stage cleanup-inspectors
          --controller-root "$RUNNER_TEMP/teleclaude-release-controller"

  capture-release:
    name: Capture one immutable source interval
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        !(github.event_name == 'workflow_dispatch' &&
          (inputs.operation == 'seed' || inputs.operation == 'reseed' || inputs.operation == 'retry' || inputs.operation == 'cancel')) &&
        !(github.event_name == 'workflow_dispatch' && inputs.operation == 'release' &&
          inputs.version == '' &&
          needs.recover-publication.outputs.publication_enabled != 'true')
      }}
    needs:
      - recover-publication
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    outputs:
      capture_status: ${{ steps.capture.outputs.capture_status }}
      source_sha: ${{ steps.capture.outputs.source_sha }}
      baseline_tag: ${{ steps.capture.outputs.baseline_tag }}
      baseline_sha: ${{ steps.capture.outputs.baseline_sha }}
      latest_completed_tag: ${{ steps.capture.outputs.latest_completed_tag }}
      decision_mode: ${{ steps.capture.outputs.decision_mode }}
      requested_version: ${{ steps.capture.outputs.requested_version }}
      publication_enabled: ${{ steps.activation.outputs.enabled }}
      artifact_id: ${{ steps.capture_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.capture_upload.outputs.artifact-digest }}
      artifact_manifest_sha256: ${{ steps.manifest.outputs.artifact_manifest_sha256 }}
    env:
      RELEASE_OPERATION: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.operation }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked controller dependencies
        run: 'python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

          uv sync --frozen --group dev --no-install-project

          '
      - name: Capture canonical source and baseline after stream admission
        id: capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tools.ci.capture_release_attempt --output-directory "$RUNNER_TEMP/release-capture"
      - name: Confirm checked out source is the captured source
        if: ${{ steps.capture.outputs.capture_status == 'ready' }}
        env:
          CAPTURED_SOURCE_SHA: ${{ steps.capture.outputs.source_sha }}
        run: 'git checkout --detach "$CAPTURED_SOURCE_SHA"

          test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE_SHA"

          '
      - name: Build bounded shared evidence
        if: ${{ steps.capture.outputs.capture_status == 'ready' }}
        run: uv run python -m tools.ci.build_release_prompt --attempt "$RUNNER_TEMP/release-capture/attempt.json" --output-directory "$RUNNER_TEMP/release-capture/evidence"
      - name: Read checked-in publication activation
        id: activation
        run: echo "enabled=$RELEASE_PUBLICATION_ENABLED" >> "$GITHUB_OUTPUT"
      - name: Manifest owned result evidence
        id: manifest
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage write-artifact-manifest --root "$RUNNER_TEMP/release-capture"
      - name: Retain immutable job evidence
        id: capture_upload
        if: ${{ always() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Confirm job evidence identity
        if: ${{ always() && steps.capture_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage confirm-upload --name "release-capture-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ steps.capture_upload.outputs.artifact-id }}" --digest "${{ steps.capture_upload.outputs.artifact-digest
          }}"
  inspect-codex:
    name: Native Codex assessment on a fresh runner
    needs:
      - capture-release
    if: ${{ needs.capture-release.result == 'success' && needs.capture-release.outputs.capture_status == 'ready' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      codex_success: ${{ steps.codex_settled_confirm.outputs.codex_success }}
      artifact_id: ${{ steps.provider_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.provider_upload.outputs.artifact-digest }}
      artifact_manifest_sha256: ${{ steps.manifest.outputs.artifact_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.capture-release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install locked controller dependencies
        run: 'python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

          uv sync --frozen --group dev --no-install-project

          '
      - name: Consume the exact frozen attempt and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage download-artifact --name "release-capture-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ needs.capture-release.outputs.artifact_id }}" --digest "${{ needs.capture-release.outputs.artifact_digest
          }}" --destination "$RUNNER_TEMP/release-capture-download" --manifest-sha256 "${{ needs.capture-release.outputs.artifact_manifest_sha256 }}"
      - name: Install only the pinned native codex client
        run:
          'uv run python -m tools.ci.install_inspector_runtime --provider release-codex-inspector --evidence "$RUNNER_TEMP/release-capture-download/files/evidence"

          uv run python -m tools.ci.install_age'
      - name: Probe native Codex sandbox before credential restoration
        id: codex_preflight
        continue-on-error: true
        run: uv run python -m tools.ci.inspector_sandbox_preflight --output-directory "$RUNNER_TEMP/release-codex/codex-preflight" --attempt-output "$RUNNER_TEMP/release-codex/codex-result/codex-attempt.json"
      - name: Restore Codex state and write begin checkpoint
        id: codex_prepare
        continue-on-error: true
        if: ${{ steps.codex_preflight.outcome == 'success' && steps.codex_preflight.outputs.codex_sandbox_ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_AUTH_AGE_IDENTITY: ${{ secrets.CODEX_AUTH_AGE_IDENTITY }}
        run:
          uv run python -m tools.ci.release_stage prepare-codex --attempt "$RUNNER_TEMP/release-capture-download/files/attempt.json" --evidence "$RUNNER_TEMP/release-capture-download/files/evidence" --state-directory "$RUNNER_TEMP/release-auth/state"
          --result-directory "$RUNNER_TEMP/release-codex/codex-result"
      - name: Upload Codex begin checkpoint before invoking the client
        id: codex_begin_upload
        if: ${{ steps.codex_prepare.outputs.codex_prepared == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.codex_prepare.outputs.codex_begin_name }}
          path: ${{ steps.codex_prepare.outputs.codex_begin_directory }}/*
          if-no-files-found: error
          retention-days: 90
      - name: Confirm begin checkpoint before Codex can refresh
        id: codex_begin_confirm
        continue-on-error: true
        if: ${{ always() && steps.codex_prepare.outputs.codex_prepared == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOADED_ARTIFACT_ID: ${{ steps.codex_begin_upload.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.codex_begin_upload.outputs.artifact-digest }}
        run: uv run python -m tools.ci.release_stage confirm-codex-begin --state-directory "$RUNNER_TEMP/release-auth/state"
      - name: Run isolated Codex inspection and settle refreshed auth
        id: codex_run
        continue-on-error: true
        if: ${{ steps.codex_begin_confirm.outputs.codex_begin_confirmed == 'true' }}
        env:
          CODEX_AUTH_AGE_IDENTITY: ${{ secrets.CODEX_AUTH_AGE_IDENTITY }}
        run: uv run python -m tools.ci.release_stage run-codex --state-directory "$RUNNER_TEMP/release-auth/state" --report-output "$RUNNER_TEMP/release-codex/codex-result"
      - name: Upload encrypted settled Codex state
        id: codex_settled_upload
        if: ${{ always() && steps.codex_run.outputs.codex_settlement_artifact == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.codex_run.outputs.codex_settled_name }}
          path: ${{ steps.codex_run.outputs.codex_settled_directory }}/*
          if-no-files-found: error
          retention-days: 90
      - name: Confirm refreshed auth was durably settled
        id: codex_settled_confirm
        continue-on-error: true
        if: ${{ always() && steps.codex_run.outputs.codex_settlement_artifact == 'true' && steps.codex_settled_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOADED_ARTIFACT_ID: ${{ steps.codex_settled_upload.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.codex_settled_upload.outputs.artifact-digest }}
        run: uv run python -m tools.ci.release_stage confirm-codex-settled --result-directory "$RUNNER_TEMP/release-codex/codex-result" --state-directory "$RUNNER_TEMP/release-auth/state"
      - name: Ensure typed Codex outcome exists
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage ensure-provider-attempt --provider codex --path "$RUNNER_TEMP/release-codex/codex-result/codex-attempt.json"
      - name: Clean owned native client state
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage cleanup-inspectors --bootstrap-receipt "$RUNNER_TEMP/release-inspector-bootstrap.json"
      - name: Manifest owned result evidence
        id: manifest
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage write-artifact-manifest --root "$RUNNER_TEMP/release-codex"
      - name: Retain immutable job evidence
        id: provider_upload
        if: ${{ always() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-codex-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-codex
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Confirm job evidence identity
        if: ${{ always() && steps.provider_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage confirm-upload --name "release-codex-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ steps.provider_upload.outputs.artifact-id }}" --digest "${{ steps.provider_upload.outputs.artifact-digest
          }}"
  inspect-claude:
    name: Native Claude fallback on a separate fresh runner
    needs:
      - capture-release
      - inspect-codex
    if:
      ${{ always() && !cancelled() && needs.capture-release.result == 'success' && needs.capture-release.outputs.capture_status == 'ready' && (needs.inspect-codex.result != 'success'
      || needs.inspect-codex.outputs.codex_success != 'true' || needs.inspect-codex.outputs.artifact_id == '' || needs.inspect-codex.outputs.artifact_digest == '' || needs.inspect-codex.outputs.artifact_manifest_sha256 == '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      claude_success: ${{ steps.claude_run.outputs.claude_success }}
      artifact_id: ${{ steps.provider_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.provider_upload.outputs.artifact-digest }}
      artifact_manifest_sha256: ${{ steps.manifest.outputs.artifact_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.capture-release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install locked controller dependencies
        run: 'python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

          uv sync --frozen --group dev --no-install-project

          '
      - name: Consume the exact frozen attempt and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage download-artifact --name "release-capture-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ needs.capture-release.outputs.artifact_id }}" --digest "${{ needs.capture-release.outputs.artifact_digest
          }}" --destination "$RUNNER_TEMP/release-capture-download" --manifest-sha256 "${{ needs.capture-release.outputs.artifact_manifest_sha256 }}"
      - name: Install only the pinned native claude client
        run: uv run python -m tools.ci.install_inspector_runtime --provider release-claude-inspector --evidence "$RUNNER_TEMP/release-capture-download/files/evidence"
      - name: Run restricted Claude fallback for unsuccessful Codex
        id: claude_run
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run python -m tools.ci.release_stage run-claude --attempt "$RUNNER_TEMP/release-capture-download/files/attempt.json" --evidence "$RUNNER_TEMP/release-capture-download/files/evidence" --output-directory "$RUNNER_TEMP/release-claude/claude"
      - name: Ensure typed Claude outcome exists when attempted
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage ensure-provider-attempt --provider claude --path "$RUNNER_TEMP/release-claude/claude/claude-attempt.json"
      - name: Clean owned native client state
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage cleanup-inspectors --bootstrap-receipt "$RUNNER_TEMP/release-inspector-bootstrap.json"
      - name: Manifest owned result evidence
        id: manifest
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage write-artifact-manifest --root "$RUNNER_TEMP/release-claude"
      - name: Retain immutable job evidence
        id: provider_upload
        if: ${{ always() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-claude-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-claude
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Confirm job evidence identity
        if: ${{ always() && steps.provider_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage confirm-upload --name "release-claude-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ steps.provider_upload.outputs.artifact-id }}" --digest "${{ steps.provider_upload.outputs.artifact-digest
          }}"
  release-analysis:
    name: Select an artifact-bound complete report
    needs:
      - capture-release
      - inspect-codex
      - inspect-claude
    if: ${{ always() && !cancelled() && needs.capture-release.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      capture_status: ${{ needs.capture-release.outputs.capture_status }}
      source_sha: ${{ needs.capture-release.outputs.source_sha }}
      baseline_tag: ${{ needs.capture-release.outputs.baseline_tag }}
      baseline_sha: ${{ needs.capture-release.outputs.baseline_sha }}
      latest_completed_tag: ${{ needs.capture-release.outputs.latest_completed_tag }}
      decision_mode: ${{ needs.capture-release.outputs.decision_mode }}
      requested_version: ${{ needs.capture-release.outputs.requested_version }}
      publication_enabled: ${{ needs.capture-release.outputs.publication_enabled }}
      selected_classification: ${{ steps.select.outputs.selected_classification }}
      selected_provider: ${{ steps.select.outputs.selected_provider }}
      codex_failure: ${{ steps.select.outputs.codex_failure }}
      artifact_id: ${{ steps.analysis_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.analysis_upload.outputs.artifact-digest }}
      artifact_manifest_sha256: ${{ steps.manifest.outputs.artifact_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.capture-release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked controller dependencies
        run: 'python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

          uv sync --frozen --group dev --no-install-project

          '
      - name: Consume the exact frozen attempt and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage download-artifact --name "release-capture-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ needs.capture-release.outputs.artifact_id }}" --digest "${{ needs.capture-release.outputs.artifact_digest
          }}" --destination "$RUNNER_TEMP/release-capture-download" --manifest-sha256 "${{ needs.capture-release.outputs.artifact_manifest_sha256 }}"
      - name: Collect outcomes and select without inventing missing client evidence
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_ARTIFACT_ID: ${{ needs.inspect-codex.outputs.artifact_id }}
          CODEX_ARTIFACT_DIGEST: ${{ needs.inspect-codex.outputs.artifact_digest }}
          CODEX_ARTIFACT_MANIFEST_SHA256: ${{ needs.inspect-codex.outputs.artifact_manifest_sha256 }}
          CODEX_JOB_RESULT: ${{ needs.inspect-codex.result }}
          CLAUDE_ARTIFACT_ID: ${{ needs.inspect-claude.outputs.artifact_id }}
          CLAUDE_ARTIFACT_DIGEST: ${{ needs.inspect-claude.outputs.artifact_digest }}
          CLAUDE_ARTIFACT_MANIFEST_SHA256: ${{ needs.inspect-claude.outputs.artifact_manifest_sha256 }}
          CLAUDE_JOB_RESULT: ${{ needs.inspect-claude.result }}
        run: uv run python -m tools.ci.release_stage collect-analysis --capture-directory "$RUNNER_TEMP/release-capture-download/files" --output-directory "$RUNNER_TEMP/release-analysis"
      - name: Manifest owned result evidence
        id: manifest
        if: ${{ always() }}
        run: uv run python -m tools.ci.release_stage write-artifact-manifest --root "$RUNNER_TEMP/release-analysis"
      - name: Retain immutable job evidence
        id: analysis_upload
        if: ${{ always() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-analysis
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Confirm job evidence identity
        if: ${{ always() && steps.analysis_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          uv run python -m tools.ci.release_stage confirm-upload --name "release-analysis-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ steps.analysis_upload.outputs.artifact-id }}" --digest "${{ steps.analysis_upload.outputs.artifact-digest
          }}"

  candidate:
    name: Materialize and lint the final candidate
    if: >-
      ${{
        !cancelled() &&
        needs.release-analysis.result == 'success' &&
        needs.release-analysis.outputs.capture_status == 'ready' &&
        (
          needs.release-analysis.outputs.decision_mode == 'manual' ||
          contains(fromJSON('["patch","minor","major"]'), needs.release-analysis.outputs.selected_classification)
        )
      }}
    needs: [release-analysis]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    outputs:
      artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate_upload.outputs.artifact-digest }}
      candidate_version: ${{ steps.candidate_version.outputs.version }}
      candidate_sha: ${{ steps.prepare_auto.outputs.candidate_sha || steps.prepare_manual.outputs.candidate_sha }}
      candidate_tree_sha: ${{ steps.prepare_auto.outputs.candidate_tree_sha || steps.prepare_manual.outputs.candidate_tree_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-analysis.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install locked candidate lint dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --group dev --no-install-project
          source bin/init/tool_versions.sh
          npm install --global --no-audit --no-fund "prettier@$PRETTIER_INSTALL_VERSION"
          python3 tools/ci/export_env.py --path "$GITHUB_WORKSPACE/bin"
      - name: Install native libraries the candidate's modules load
        run: uv run python -m tools.ci.install_candidate_native_libraries
      - name: Download and verify captured inspection artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage download-artifact
          --name "release-analysis-${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-id "${{ needs.release-analysis.outputs.artifact_id }}"
          --digest "${{ needs.release-analysis.outputs.artifact_digest }}"
          --destination "$RUNNER_TEMP/release-analysis-download"
          --manifest-sha256 "${{ needs.release-analysis.outputs.artifact_manifest_sha256 }}"
      - name: Compute selected semantic version
        id: version
        if: ${{ needs.release-analysis.outputs.capture_status == 'ready' && needs.release-analysis.outputs.decision_mode == 'automatic' }}
        env:
          BASELINE_TAG: ${{ needs.release-analysis.outputs.baseline_tag }}
          BUMP: ${{ needs.release-analysis.outputs.selected_classification }}
        run: uv run python -m tools.ci.compute_next_version
      - name: Select the version to materialize
        id: candidate_version
        env:
          NORMAL_VERSION: ${{ steps.version.outputs.next_tag }}
          REQUESTED_VERSION: ${{ needs.release-analysis.outputs.requested_version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"; else echo "version=$NORMAL_VERSION" >> "$GITHUB_OUTPUT"; fi
      - name: Select the exact captured Git range for release notes
        env:
          CAPTURED_BASELINE_SHA: ${{ needs.release-analysis.outputs.baseline_sha }}
          CAPTURED_SOURCE_SHA: ${{ needs.release-analysis.outputs.source_sha }}
        run: |
          if [ -n "$CAPTURED_BASELINE_SHA" ]; then
            printf 'GIT_CLIFF_RANGE=%s..%s\n' "$CAPTURED_BASELINE_SHA" "$CAPTURED_SOURCE_SHA" >> "$GITHUB_ENV"
          else
            printf 'GIT_CLIFF_RANGE=%s\n' "$CAPTURED_SOURCE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Generate complete captured commit notes with git-cliff
        id: git_cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          CANDIDATE_VERSION: ${{ steps.candidate_version.outputs.version }}
        with:
          version: v2.14.2
          config: cliff.toml
          args: >-
            --no-exec
            --offline
            --tag "$CANDIDATE_VERSION"
            --output "$RUNNER_TEMP/release-commit-notes.md"
            "$GIT_CLIFF_RANGE"
      - name: Verify complete commit identity coverage
        env:
          CAPTURED_BASELINE_SHA: ${{ needs.release-analysis.outputs.baseline_sha }}
          CAPTURED_SOURCE_SHA: ${{ needs.release-analysis.outputs.source_sha }}
        run: |
          args=(--source "$CAPTURED_SOURCE_SHA" --notes "$RUNNER_TEMP/release-commit-notes.md")
          if [ -n "$CAPTURED_BASELINE_SHA" ]; then args+=(--baseline "$CAPTURED_BASELINE_SHA"); fi
          uv run python -m tools.release.changelog verify-commit-notes "${args[@]}"
      - name: Freeze automatically assessed candidate
        id: prepare_auto
        if: ${{ needs.release-analysis.outputs.decision_mode == 'automatic' }}
        run: >-
          uv run python -m tools.ci.commit_release_artifacts
          --attempt "$RUNNER_TEMP/release-analysis-download/files/attempt.json"
          --selection "$RUNNER_TEMP/release-analysis-download/files/selection/selection.json"
          --version "${{ steps.candidate_version.outputs.version }}"
          --commit-notes-file "$RUNNER_TEMP/release-commit-notes.md"
          --output-directory "$RUNNER_TEMP/release-candidate"
      - name: Freeze manually versioned candidate
        id: prepare_manual
        if: ${{ needs.release-analysis.outputs.decision_mode == 'manual' }}
        run: >-
          uv run python -m tools.ci.commit_release_artifacts
          --attempt "$RUNNER_TEMP/release-analysis-download/files/attempt.json"
          --manual-summary "$RUNNER_TEMP/release-analysis-download/files/selection/selection.json"
          --version "${{ steps.candidate_version.outputs.version }}"
          --commit-notes-file "$RUNNER_TEMP/release-commit-notes.md"
          --output-directory "$RUNNER_TEMP/release-candidate"
      - name: Run native lint on the final candidate
        id: lint
        if: ${{ steps.prepare_auto.outcome == 'success' || steps.prepare_manual.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          telec repo lint --all > "$RUNNER_TEMP/candidate-lint.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/candidate-lint.log"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 0 ] && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          exit 1
      - name: Run full runtime acceptance on the frozen candidate
        id: runtime_acceptance
        if: ${{ always() && (steps.prepare_auto.outcome == 'success' || steps.prepare_manual.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 65
        env:
          PYTHONPATH: ${{ github.workspace }}
          CANDIDATE_SHA: ${{ steps.prepare_auto.outputs.candidate_sha || steps.prepare_manual.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ steps.prepare_auto.outputs.candidate_tree_sha || steps.prepare_manual.outputs.candidate_tree_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-candidate"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE_SHA"
          set +e
          uv run --no-project --python 3.12 python -P tools/ci/runtime_acceptance.py \
            --profile full \
            --root "$GITHUB_WORKSPACE" \
            --source-revision "$CANDIDATE_SHA" \
            --source-tree "$CANDIDATE_TREE_SHA" \
            --report "$RUNNER_TEMP/release-candidate/runtime-acceptance-report.json"
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Verify the runtime profile left the frozen candidate unchanged
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.prepare_auto.outputs.candidate_sha || steps.prepare_manual.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ steps.prepare_auto.outputs.candidate_tree_sha || steps.prepare_manual.outputs.candidate_tree_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Detect retained candidate files
        id: candidate_files
        if: always()
        shell: bash
        run: tools/ci/detect_release_artifacts.sh file "$RUNNER_TEMP/release-candidate/candidate-identity.json"
      - name: Bind lint result to the committed candidate
        if: ${{ always() && steps.candidate_files.outputs.present == 'true' }}
        env:
          LINT_SUCCEEDED: ${{ steps.lint.outcome == 'success' }}
        run: |
          args=(--candidate "$RUNNER_TEMP/release-candidate/candidate-identity.json" --log "$RUNNER_TEMP/candidate-lint.log" --output "$RUNNER_TEMP/release-candidate/candidate-check.json")
          args+=(--runtime-report "$RUNNER_TEMP/release-candidate/runtime-acceptance-report.json")
          if [ "$LINT_SUCCEEDED" = 'true' ]; then args+=(--success); fi
          if [ "${{ steps.runtime_acceptance.outcome }}" = 'success' ]; then args+=(--runtime-success); fi
          uv run python -m tools.ci.release_stage record-candidate-check "${args[@]}"
      - name: Upload immutable candidate and lint result
        id: candidate_upload
        if: ${{ always() && steps.candidate_files.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-candidate/candidate.bundle
            ${{ runner.temp }}/release-candidate/candidate-identity.json
            ${{ runner.temp }}/release-candidate/commit-notes.md
            ${{ runner.temp }}/release-candidate/candidate-check.json
            ${{ runner.temp }}/release-candidate/runtime-acceptance-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Confirm candidate artifact identity
        if: ${{ always() && steps.candidate_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage confirm-upload
          --name "release-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-id "${{ steps.candidate_upload.outputs.artifact-id }}"
          --digest "${{ steps.candidate_upload.outputs.artifact-digest }}"

  installer-proof:
    name: Prove the exact candidate on hosted macOS
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    needs: [release-analysis, candidate]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    outputs:
      artifact_id: ${{ steps.proof_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.proof_upload.outputs.artifact-digest }}
      proof_succeeded: ${{ steps.record_proof.outputs.proof_succeeded }}
      proof_evidence_sha256: ${{ steps.record_proof.outputs.proof_evidence_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-analysis.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv for the hosted proof runner
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install relocatable Python and proof controller dependencies
        run: |
          uv python install --no-bin "$PYTHON_VERSION"
          uv sync --frozen --group dev --no-install-project
          uv run python tools/ci/export_env.py --path "$GITHUB_WORKSPACE/bin"
      - name: Download exact candidate artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage download-artifact-exact
          --name "release-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-id "${{ needs.candidate.outputs.artifact_id }}"
          --digest "${{ needs.candidate.outputs.artifact_digest }}"
          --destination "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}"
          --files candidate.bundle candidate-identity.json commit-notes.md candidate-check.json runtime-acceptance-report.json
      - name: Keep captured source as local main and select candidate
        id: proof_checkout
        run: >-
          uv run python -m tools.ci.release_stage prepare-proof-checkout
          --candidate "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}/files/candidate-identity.json"
          --bundle "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}/files/candidate.bundle"
      - name: Run the existing complete installer harness
        id: installer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/harness"
          set +e
          uv run python -m tools.ci.bootstrap \
            --output-dir "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/harness" \
            > "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/installer-harness.txt" 2>&1
          result=$?
          cat "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/installer-harness.txt"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Record candidate-bound installer proof and logs
        id: record_proof
        if: ${{ always() && steps.proof_checkout.outcome == 'success' }}
        env:
          HARNESS_EXIT_CODE: ${{ steps.installer.outputs.exit_code || '1' }}
        run: >-
          uv run python -m tools.ci.release_stage record-proof
          --candidate "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}/files/candidate-identity.json"
          --candidate-check "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}/files/candidate-check.json"
          --runtime-report "$RUNNER_TEMP/release-candidate-download-${{ github.run_id }}-${{ github.run_attempt }}/files/runtime-acceptance-report.json"
          --harness-output "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}"
          --harness-exit-code "$HARNESS_EXIT_CODE"
          --output-directory "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/artifacts"
      - name: Detect retained proof files
        id: proof_files
        if: always()
        shell: bash
        run: tools/ci/detect_release_artifacts.sh file "$RUNNER_TEMP/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/proof-identity.json"
      - name: Upload installer logs and proof receipt
        id: proof_upload
        if: ${{ always() && steps.proof_files.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/proof-identity.json
            ${{ runner.temp }}/release-proof-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/proof-log.txt
          if-no-files-found: error
          retention-days: 90
      - name: Confirm proof artifact identity
        if: ${{ always() && steps.proof_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage confirm-upload
          --name "release-proof-${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-id "${{ steps.proof_upload.outputs.artifact-id }}"
          --digest "${{ steps.proof_upload.outputs.artifact-digest }}"

  publish:
    name: Publish only an exactly proved candidate
    if: >-
      ${{
        !cancelled() &&
        needs.candidate.result == 'success' &&
        needs.installer-proof.result == 'success' &&
        (
          (
            needs.release-analysis.outputs.decision_mode == 'manual' &&
            github.event_name == 'workflow_dispatch' &&
            inputs.operation == 'release'
          ) ||
          (
            needs.release-analysis.outputs.decision_mode == 'automatic' &&
            needs.release-analysis.outputs.publication_enabled == 'true' &&
            (github.event_name == 'schedule' || inputs.operation == 'release')
          )
        )
      }}
    needs: [release-analysis, candidate, installer-proof]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      release_url: ${{ steps.publisher.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-analysis.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked publisher dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --group dev --no-install-project
      - name: Download exact candidate and proof artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m tools.ci.release_stage download-artifact-exact \
            --name "release-candidate-${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-id "${{ needs.candidate.outputs.artifact_id }}" \
            --digest "${{ needs.candidate.outputs.artifact_digest }}" \
            --destination "$RUNNER_TEMP/candidate" \
            --files candidate.bundle candidate-identity.json commit-notes.md candidate-check.json runtime-acceptance-report.json
          uv run python -m tools.ci.release_stage download-artifact-exact \
            --name "release-proof-${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-id "${{ needs.installer-proof.outputs.artifact_id }}" \
            --digest "${{ needs.installer-proof.outputs.artifact_digest }}" \
            --destination "$RUNNER_TEMP/proof" \
            --files proof-identity.json proof-log.txt
      - name: Publish or resume the exact candidate transaction
        id: publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.publish_release
          --candidate "$RUNNER_TEMP/candidate/files/candidate-identity.json"
          --proof "$RUNNER_TEMP/proof/files/proof-identity.json"
          --candidate-check "$RUNNER_TEMP/candidate/files/candidate-check.json"
          --runtime-report "$RUNNER_TEMP/candidate/files/runtime-acceptance-report.json"
          --bundle "$RUNNER_TEMP/candidate/files/candidate.bundle"
          --commit-notes "$RUNNER_TEMP/candidate/files/commit-notes.md"
          --receipt "$RUNNER_TEMP/release-publication/publication-receipt.json"
      - name: Detect retained publication files
        id: publication_files
        if: always()
        shell: bash
        run: tools/ci/detect_release_artifacts.sh file "$RUNNER_TEMP/release-publication/publication-receipt.json"
      - name: Retain the partial or completed publication receipt
        id: publication_upload
        if: ${{ always() && steps.publication_files.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publication/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Confirm retained publication receipt
        if: ${{ always() && steps.publication_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m tools.ci.release_stage confirm-upload
          --name "release-publication-${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-id "${{ steps.publication_upload.outputs.artifact-id }}"
          --digest "${{ steps.publication_upload.outputs.artifact-digest }}"

  release-summary:
    name: Report release outcome
    if: always()
    needs: [recover-publication, seed-auth, release-analysis, candidate, installer-proof, publish]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Summarize the visible stage outcome
        env:
          OPERATION: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.operation }}
          RECOVERY_RESULT: ${{ needs.recover-publication.result }}
          RECOVERED: ${{ needs.recover-publication.outputs.recovered }}
          RECOVERED_URL: ${{ needs.recover-publication.outputs.recovered_release_url }}
          CHECKED_IN_PUBLICATION_ENABLED: ${{ needs.recover-publication.outputs.publication_enabled }}
          SEED_RESULT: ${{ needs.seed-auth.result }}
          CAPTURE_STATUS: ${{ needs.release-analysis.outputs.capture_status }}
          DECISION_MODE: ${{ needs.release-analysis.outputs.decision_mode }}
          REQUESTED_VERSION: ${{ needs.release-analysis.outputs.requested_version }}
          ANALYSIS_RESULT: ${{ needs.release-analysis.result }}
          SELECTED_PROVIDER: ${{ needs.release-analysis.outputs.selected_provider }}
          SELECTED_CLASSIFICATION: ${{ needs.release-analysis.outputs.selected_classification }}
          CODEX_FAILURE: ${{ needs.release-analysis.outputs.codex_failure }}
          PUBLICATION_ENABLED: ${{ needs.release-analysis.outputs.publication_enabled }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.candidate_version }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          PROOF_DIGEST: ${{ needs.installer-proof.outputs.proof_evidence_sha256 }}
          PROOF_ARTIFACT_ID: ${{ needs.installer-proof.outputs.artifact_id }}
          PROOF_ARTIFACT_DIGEST: ${{ needs.installer-proof.outputs.artifact_digest }}
          PROOF_RESULT: ${{ needs.installer-proof.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
        run: >-
          echo "Release summary: operation=$OPERATION recovery=$RECOVERY_RESULT recovered=$RECOVERED recovered_url=$RECOVERED_URL seed=$SEED_RESULT capture=$CAPTURE_STATUS decision=$DECISION_MODE requested_version=$REQUESTED_VERSION analysis=$ANALYSIS_RESULT provider=$SELECTED_PROVIDER classification=$SELECTED_CLASSIFICATION codex_failure=$CODEX_FAILURE publication_enabled=$CHECKED_IN_PUBLICATION_ENABLED candidate=$CANDIDATE_RESULT candidate_version=$CANDIDATE_VERSION candidate_sha=$CANDIDATE_SHA proof=$PROOF_RESULT proof_sha256=$PROOF_DIGEST proof_artifact_id=$PROOF_ARTIFACT_ID proof_artifact_digest=$PROOF_ARTIFACT_DIGEST publish=$PUBLISH_RESULT release_url=$RELEASE_URL"
