name: Release Automation

on:
  workflow_run:
    workflows: ['Lint and Test']
    branches: [main]
    types:
      - completed

jobs:
  release-analysis:
    name: AI Release Analysis
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use repo-local telec
        run: python3 tools/ci/export_env.py --path "$GITHUB_WORKSPACE/bin"

      - name: Resolve credentials
        run: uv run python -m tools.ci.resolve_credentials

      - name: Full TeleClaude Bootstrap
        run: make install

      - name: Prepare Analysis Context
        run: uv run python -m tools.ci.build_release_prompt

      - name: Run Release Lanes and Consolidate
        run: uv run scripts/release_lanes.py --prompt-file release-prompt.txt --schema-file docs/project/spec/release-report-schema.md

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-reports
          path: |
            *-report.json
            arbiter-decision.json
          if-no-files-found: warn

  release-arbitration:
    name: Read Arbiter Decision
    needs: [release-analysis]
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      release_authorized: ${{ steps.arbiter.outputs.release_authorized }}
      target_version: ${{ steps.arbiter.outputs.target_version }}
    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: ai-release-reports
      - name: Extract Decision
        id: arbiter
        run: uv run python -m tools.ci.read_arbiter_decision

  authorized-tag:
    name: Create Release Tag
    needs: [release-arbitration]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ needs.release-arbitration.outputs.release_authorized == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use repo-local telec
        run: python3 tools/ci/export_env.py --path "$GITHUB_WORKSPACE/bin"
      - name: Bootstrap Environment
        run: make install
      - name: Download Arbiter Decision
        uses: actions/download-artifact@v4
        with:
          name: ai-release-reports
      - name: Compute Next Version
        id: version
        env:
          BUMP: ${{ needs.release-arbitration.outputs.target_version }}
        run: uv run python -m tools.ci.compute_next_version
      - name: Generate manifests for tag baseline
        run: uv run python -m tools.ci.export_manifests

      - name: Generate Changelog
        env:
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: uv run scripts/release_changelog.py from-reports --tag "$NEXT_TAG" --since "$LAST_TAG" --claude-report claude-report.json --codex-report codex-report.json --gemini-report gemini-report.json --output release-notes.md --prepend CHANGELOG.md

      - name: Commit version bump, manifests, and changelog
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: uv run python -m tools.ci.commit_release_artifacts

      - name: Create Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: uv run python -m tools.ci.publish_release
