name: Release Automation

on:
  workflow_run:
    workflows: ["Lint and Test"]
    branches: [main]
    types:
      - completed

jobs:
  release-analysis:
    name: AI Release Analysis
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      TELECLAUDE_CONFIG_PATH: tests/integration/config.yml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve credentials
        run: |
          # The runner's HOME may have wrong case on case-sensitive APFS.
          # Always resolve from disk — dscl and $HOME are both unreliable.
          REAL_HOME="$(find /Users -maxdepth 1 -iname "$(whoami)" -type d 2>/dev/null | head -1)"
          if [ -n "$REAL_HOME" ] && [ "$REAL_HOME" != "$HOME" ]; then
            echo "Correcting HOME: $HOME -> $REAL_HOME"
            echo "HOME=$REAL_HOME" >> "$GITHUB_ENV"
            export HOME="$REAL_HOME"
          fi
          echo "Effective HOME=$HOME"

          # Claude: extract OAuth access token from macOS keychain and export
          # as ANTHROPIC_API_KEY. The desktop app config file is unreliable
          # on CI (case-sensitive path issues); the keychain is authoritative.
          CREDS="$(security find-generic-password -s 'Claude Code-credentials' -w 2>/dev/null || true)"
          if [ -z "$CREDS" ]; then
            echo "::error::Claude Code credentials not found in keychain. Run: claude login"
            exit 1
          fi
          ACCESS_TOKEN="$(echo "$CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['claudeAiOauth']['accessToken'])" 2>/dev/null || true)"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Could not extract accessToken from keychain credentials"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ANTHROPIC_API_KEY=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "Claude API key extracted from keychain"

          # Codex: ~/.codex/auth.json
          errors=0
          if [ ! -f "$HOME/.codex/auth.json" ]; then
            echo "::error::Codex credentials not found at ~/.codex/auth.json. Run: codex auth login"
            errors=$((errors + 1))
          fi

          # Gemini: ~/.gemini/oauth_creds.json
          if [ ! -f "$HOME/.gemini/oauth_creds.json" ]; then
            echo "::error::Gemini credentials not found at ~/.gemini/oauth_creds.json. Run: gemini auth login"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors CLI credential(s) missing or invalid"
            exit 1
          fi
          echo "All CLI credentials verified"

      - name: Full TeleClaude Bootstrap
        run: make bootstrap-ci

      - name: Verify Agent Invocation Matrix
        continue-on-error: true
        run: |
          ./.venv/bin/python -m pytest tests/integration/test_agent_invocation_matrix.py \
            -v --timeout=120

      - name: Prepare Analysis Context
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV
          if [ -n "$LAST_TAG" ]; then
            git diff "$LAST_TAG"..HEAD > release-diff.txt
          else
            git ls-files > release-diff.txt
          fi

          # Build the full prompt to a file so it doesn't blow the arg limit
          {
            cat docs/project/spec/release-inspector-prompt.md
            echo ""
            echo "MANIFESTS:"
            echo "CLI:"
            ./.venv/bin/python -c "from teleclaude.cli.telec.surface import export_surface_markdown; print(export_surface_markdown())"
            echo "Events:"
            ./.venv/bin/python -c "from teleclaude.events.schema_export import export_events_markdown; print(export_events_markdown())"
            echo "Config:"
            ./.venv/bin/python -c "from teleclaude.config.schema_export import export_config_markdown; print(export_config_markdown())"
            echo ""
            echo "DIFF:"
            cat release-diff.txt
          } > release-prompt.txt
          echo "Prompt size: $(wc -c < release-prompt.txt) bytes"

      - name: Claude Release Lane
        continue-on-error: true
        run: |
          ./.venv/bin/python -m teleclaude.helpers.agent_cli \
            --agent claude --thinking-mode slow \
            --prompt-file release-prompt.txt \
            --schema-file docs/project/spec/release-report-schema.md > claude-report.json

      - name: Codex Release Lane
        continue-on-error: true
        run: |
          ./.venv/bin/python -m teleclaude.helpers.agent_cli \
            --agent codex --thinking-mode slow \
            --prompt-file release-prompt.txt \
            --schema-file docs/project/spec/release-report-schema.md > codex-report.json

      - name: Gemini Release Lane
        continue-on-error: true
        run: |
          ./.venv/bin/python -m teleclaude.helpers.agent_cli \
            --agent gemini --thinking-mode slow \
            --prompt-file release-prompt.txt \
            --schema-file docs/project/spec/release-report-schema.md > gemini-report.json

      - name: Verify quorum (2 of 3 lanes)
        run: |
          count=0
          for f in claude-report.json codex-report.json gemini-report.json; do
            if [ -s "$f" ]; then
              count=$((count + 1))
              echo "✓ $f present"
            else
              echo "✗ $f missing or empty"
            fi
          done
          echo "Quorum: $count/3 reports"
          if [ "$count" -lt 2 ]; then
            echo "::error::Release quorum not met — need at least 2 of 3 lane reports"
            exit 1
          fi

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-reports
          path: |
            claude-report.json
            codex-report.json
            gemini-report.json
          if-no-files-found: ignore

  release-arbitration:
    name: Consensus Arbiter
    needs: [release-analysis]
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      release_authorized: ${{ steps.arbiter.outputs.release_authorized }}
      target_version: ${{ steps.arbiter.outputs.target_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: ai-release-reports
      - name: Run Consensus Arbiter
        id: arbiter
        run: |
          echo "Reports collected for arbitration:"
          ls -la *.json
          echo "---"
          set +e
          ./.venv/bin/python scripts/release_consolidator.py \
            --claude-report claude-report.json \
            --codex-report codex-report.json \
            --gemini-report gemini-report.json \
            -o arbiter-decision.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "ERROR: Arbiter fatal error"
            exit 1
          fi
          echo "release_authorized=$(jq -r '.release_authorized' arbiter-decision.json)" >> "$GITHUB_OUTPUT"
          echo "target_version=$(jq -r '.target_version' arbiter-decision.json)" >> "$GITHUB_OUTPUT"
      - name: Upload Decision
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-decision
          path: arbiter-decision.json

  authorized-tag:
    name: Create Release Tag
    needs: [release-arbitration]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ needs.release-arbitration.outputs.release_authorized == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Arbiter Decision
        uses: actions/download-artifact@v4
        with:
          name: arbiter-decision
      - name: Compute Next Version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          CLEAN_VER="${LAST_TAG#v}"
          CLEAN_VER="${CLEAN_VER%%-*}"
          IFS='.' read -r major minor patch <<< "$CLEAN_VER"
          BUMP="${{ needs.release-arbitration.outputs.target_version }}"
          if [ "$BUMP" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          NEXT_TAG="v${major}.${minor}.${patch}"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $NEXT_TAG (bump=$BUMP from $LAST_TAG)"
      - name: Create Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_TAG="${{ steps.version.outputs.next_tag }}"
          CLASSIFICATION="${{ needs.release-arbitration.outputs.target_version }}"
          jq -r --arg ver "$NEXT_TAG" --arg cls "$CLASSIFICATION" \
            '"## AI Consensus Release\n\n**Version:** " + $ver + "\n**Classification:** " + $cls + "\n**Rationale:** " + .authoritative_rationale + "\n\n### Lane Summary\n" + (.lane_summary | to_entries | map("\(.key): \(.value)") | join(", ")) + "\n\n---\n*Release authorized by AI consensus arbiter.*"' \
            arbiter-decision.json > release-notes.md
          git tag "$NEXT_TAG"
          git push origin "$NEXT_TAG"
          gh release create "$NEXT_TAG" --title "$NEXT_TAG" --notes-file release-notes.md

      - name: Update pyproject.toml version on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_VER="${{ steps.version.outputs.next_tag }}"
          CLEAN_VER="${NEXT_VER#v}"
          sed -i '' "s/^version = \".*\"/version = \"${CLEAN_VER}\"/" pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${CLEAN_VER} [skip ci]"
          git push origin HEAD:main