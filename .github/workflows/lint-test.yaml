name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use repo-local telec
        run: python3 tools/ci/export_env.py --path "$GITHUB_WORKSPACE/bin"

      # Redirect the bootstrap's runtime home into the per-job RUNNER_TEMP (wiped
      # at job start and end) so install.sh never mutates the runner's live
      # ~/.teleclaude. Self-cleaning — no accumulation, no cleanup step.
      # ($RUNNER_TEMP is a runtime env var; the `runner` context is unavailable
      # at job-level `env:`, so inject via $GITHUB_ENV from a step instead.)
      - name: Isolate runtime home from the live ~/.teleclaude
        run: python3 tools/ci/export_env.py --env "TELECLAUDE_HOME=$RUNNER_TEMP/tc-home" --env "XDG_STATE_HOME=$RUNNER_TEMP/tc-home/.local/state"

      - name: Full TeleClaude Bootstrap
        run: make install
        timeout-minutes: 5

      - name: Run lint
        run: telec repo lint --all
        timeout-minutes: 5

  runtime-acceptance:
    name: Full CLI runtime acceptance
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'

      - name: Run full disposable CLI runtime profile
        timeout-minutes: 10
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-project --python 3.12 python -P tools/ci/ci_runtime_acceptance.py --root "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/runtime-acceptance/report.json"

      - name: Retain full runtime report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-acceptance/report.json
          if-no-files-found: warn
          retention-days: 30

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [lint-test, runtime-acceptance]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: tools/ci

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'

      - name: Merge minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: uv run --no-project --python 3.12 --with githubkit==0.16.1 python -P tools/ci/merge_dependabot_pr.py
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
