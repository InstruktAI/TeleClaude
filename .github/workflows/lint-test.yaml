name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint and Test
    runs-on: [self-hosted, macOS, ARM64]
    env:
      TELECLAUDE_CONFIG_PATH: tests/integration/config.yml
      TELECLAUDE_ENV_PATH: tests/integration/.env
      INSTRUKT_AI_LOG_ROOT: /tmp/teleclaude-logs

    steps:
      - uses: actions/checkout@v4

      - name: Use repo-local telec
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Full TeleClaude Bootstrap
        run: make bootstrap-ci
        timeout-minutes: 5

      - name: Run lint
        run: telec code lint --all
        timeout-minutes: 5

      - name: Run tests
        run: telec code test
        timeout-minutes: 10
        continue-on-error: false

      - name: Run process meta tests
        run: make test-meta
        timeout-minutes: 5

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
