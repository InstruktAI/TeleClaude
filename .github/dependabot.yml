# Dependabot configuration.
#
# Version updates: majors ignored (manual review only), minor/patch grouped per
# ecosystem and auto-merged once "Lint and Test" passes — see the
# dependabot-auto-merge job in .github/workflows/lint-test.yaml.
#
# Security updates: enabled at the repo level (automated-security-fixes) and
# unaffected by the major ignore below — `update-types` only gates version
# updates, so advisory fixes (including major bumps) always open. The
# `applies-to: security-updates` groups batch those advisory PRs per ecosystem.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-root:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-root-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-frontend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
