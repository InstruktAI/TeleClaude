# Minimal test configuration — all keys fall back to DEFAULT_CONFIG.
# See teleclaude/config/__init__.py for the full default structure.
#
# CI and tools/test.sh point TELECLAUDE_CONFIG_PATH here so that
# importing teleclaude.config succeeds without a real deployment config.

# Lifecycle-runner tests assume feature/change/bug autostart is enabled; the
# code default is OFF, so the test config opts in explicitly.
workflow:
  autostart:
    feature: true
    change: true
    bug: true
    task: false
  max_todo_dispatch: 5

agents:
  default: claude
