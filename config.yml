business:
  domains:
    - software-development
    - creative
agents:
  default: claude
  claude:
    enabled: true
  gemini:
    enabled: true
  codex:
    enabled: true
stt:
  enabled: true
  service_priority:
    - parakeet
    - openai
  services:
    parakeet:
      enabled: true
      model: mlx-community/parakeet-tdt-0.6b-v3
    openai:
      enabled: true
tts:
  enabled: false
  service_priority:
    - voxcpm
    - kokoro
    - qwen3
    - openai
    - elevenlabs
    - macos
    - pyttsx3
  events:
    session_start:
      enabled: true
    agent_stop:
      enabled: true
  services:
    voxcpm:
      enabled: true
      model: mlx-community/voxcpm1.5
      params:
        temperature: 0.5
        speed: 1.1
        cfg_scale: 3.0
        ddpm_steps: 15
      voices:
        - name: narrator
          params:
            temperature: 0.1
            speed: 0.9
        - name: reporter
          params:
            temperature: 0.1
            speed: 1.1
        - name: excited
          params:
            temperature: 0.1
            speed: 1.2
        - name: narrator-2
          params:
            temperature: 0.2
            speed: 0.9
        - name: reporter-2
          params:
            temperature: 0.2
            speed: 1.1
        - name: excited-2
          params:
            temperature: 0.2
            speed: 1.2
        - name: narrator-3
          params:
            temperature: 0.3
            speed: 0.9
        - name: reporter-3
          params:
            temperature: 0.3
            speed: 1.1
        - name: excited-3
          params:
            temperature: 0.3
            speed: 1.2
    kokoro:
      enabled: true
