# yaml-language-server: $schema=.teleclaude/schemas/teleclaude-project.schema.json
description: AI-powered multi-agent orchestration platform
kind: project
project_name: TeleClaude
project_slug: teleclaude
company: instrukt-ai
help_desk:
  enabled: true
env_allow_list: []
business:
  publishes:
    - slug: general
      trigger: 'Always loaded: the platform-wide principles, policies and procedures
        every agent works under.'
    - slug: sdlc
      trigger: Writing, reviewing, testing, refactoring, or debugging code or
        tests
    - slug: creative
      trigger: Generating images, designing visuals, or producing creative or
        moodboard artifacts
    - slug: personal
      trigger: Work on a person's own mail, calendar and standing instructions.
        Only an agent started in that person's own workspace does this; asked
        elsewhere, an agent spawns one there rather than serving it.
# TeleClaude's checkpoint maintenance uses this project's overlay. The
# platform-wide base supplies sync for docs and agents and install for setup.
# This overlay adds the runtime-specific actions below.
checkpoint:
  maintenance:
    plumbing-convergence:
      main_only: true
      precedence: 15
      command:
        - '{interpreter}'
        - -m
        - teleclaude.project_setup.plumbing
    restart:
      main_only: true
      precedence: 100
      on_demand: defer
      owed_probe:
        - '{interpreter}'
        - -m
        - teleclaude.core.integration.deferred_probes
        - restart
        - --tip
        - '{after_sha}'
      command:
        - make
        - restart
    # Deploying the service definitions installation renders is deferred on
    # demand, so a manual run reports it instead; no scope binds it, so the
    # commit boundary never runs it.
    service-deploy:
      main_only: true
      precedence: 110
      on_demand: defer
      owed_probe:
        - '{interpreter}'
        - -m
        - teleclaude.install.service_drift
      command:
        - make
        - install
    deps:
      main_only: true
      precedence: 20
      command:
        - uv
        - sync
    config-migrate:
      main_only: true
      precedence: 25
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.config.migrations
    declaration-views-discard:
      main_only: true
      precedence: 35
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.entrypoints.declaration_view
        - discard
        - --trigger
        - maintenance
    config-schemas:
      main_only: true
      precedence: 30
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.core.reconciliation.config_schemas
    tui-reload:
      main_only: true
      precedence: 40
      on_demand: defer
      owed_probe:
        - '{interpreter}'
        - -m
        - teleclaude.core.integration.deferred_probes
        - tui-reload
        - --tip
        - '{after_sha}'
      command:
        - '{interpreter}'
        - -m
        - teleclaude.cli.tui.processes
    docs-layout-convergence:
      main_only: true
      precedence: 45
      command:
        - '{interpreter}'
        - -m
        - teleclaude.entrypoints.docs_layout_convergence
  integrator_judgment:
    - log-check
  bindings:
    # The integrator checks logs for all daemon source. There is deliberately no
    # checkpoint `code` overlay: it would bind `test`, which this project's test
    # moratorium forbids. A generic binding keeps log-check without test.
    - scope:
        include:
          - teleclaude/**/*.py
      actions:
        - log-check
          # Daemon code needs a restart. The CLI modules imported during daemon
          # startup are re-included despite the broad cli/** exclusion.
    - scope:
        include:
          - teleclaude/**/*.py
        exclude:
          - teleclaude/hooks/**
          - teleclaude/cli/**
          - teleclaude/utils/**
          - teleclaude/quality/**
          - teleclaude/session_scoping/**
          - teleclaude/project_setup/**
          - teleclaude/codegen/**
          - teleclaude/resource_validation/**
          - teleclaude/entrypoints/**
          - teleclaude/tagging/**
          - teleclaude/helpers/**
        override:
          - teleclaude/cli/__init__.py
          - teleclaude/cli/telec/__init__.py
          - teleclaude/cli/telec/surface.py
          - teleclaude/cli/telec/surface_types.py
          - teleclaude/cli/telec/auth.py
          - teleclaude/cli/telec/help.py
          - teleclaude/cli/telec/_shared.py
          - teleclaude/cli/telec/_run_tui.py
          - teleclaude/cli/tool_client.py
          - teleclaude/cli/session_auth.py
      actions:
        - restart
    - scope:
        include:
          - config.yml
      actions:
        - restart
    - scope:
        include:
          - pyproject.toml
          - requirements*.txt
      actions:
        - deps
    - scope:
        include:
          - teleclaude/install/**
          - teleclaude/project_setup/**
          - src/Launcher/**
          - teleclaude/hooks/adapters/**
          - templates/**
      actions:
        - install
    - scope:
        include:
          - templates/quality/githooks/**
      actions:
        - plumbing-convergence
    - scope:
        include:
          - templates/help-desk-*/**
          - templates/home-person/**
          - templates/home-company/**
      actions:
        - plumbing-convergence
        - sync
    - scope:
        include:
          - teleclaude/cli/tui/**
      actions:
        - tui-reload
    - scope:
        include:
          - teleclaude/config/**
      actions:
        - config-migrate
    - scope:
        include:
          - teleclaude/docs_layout.py
          - teleclaude/snippet_roots.py
      actions:
        - docs-layout-convergence
    - scope:
        include:
          - teleclaude/**
          - pyproject.toml
          - uv.lock
      actions:
        - declaration-views-discard
    - scope:
        include:
          - teleclaude/**/*.py
          - teleclaude/mcp/teleclaude-mcp.schema.json
      actions:
        - config-schemas
jobs:
  - category: system
    name: temp-reaper
    when:
      every: 60m
    script: jobs/temp_reaper.py
  - category: system
    name: project-backup
    when:
      at: 05:00
    script: jobs/project_backup.py
  - category: system
    name: log-bug-hunter
    when:
      every: 6h
    job: sdlc/procedure/maintenance/log-bug-hunter
    agent:
      - codex
      - claude
      - gemini
    thinking_mode: med
code:
  enabled: true
docs:
  enabled: true
agents:
  enabled: true
hooks:
  inbound:
    github:
      secret: ${GITHUB_WEBHOOK_SECRET}
schema_version: 16
