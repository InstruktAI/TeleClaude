project_name: TeleClaude
env_allow_list: []
frontend_root: frontend

business:
  domains:
    creative: docs
    erp: docs
    software-development: docs

# workflow:
#   autostart:
#     feature: true
#     change: true
#     bug: true
#     task: false

jobs:
  help_desk_intelligence:
    category: system
    when:
      at: '06:00'
    script: jobs/help_desk_intelligence.py

  youtube_scraper:
    category: system
    when:
      at: '06:00'
    script: jobs/youtube_scraper.py

  temp_reaper:
    category: system
    when:
      every: '60m'
    script: jobs/temp_reaper.py

  project_backup:
    category: system
    when:
      at: '05:00'
    script: jobs/project_backup.py

  youtube_sync_subscriptions:
    category: system
    when:
      at: '06:00'
    script: jobs/youtube_sync_subscriptions.py

  log_bug_hunter:
    category: system
    when:
      at: '03:00'
    type: agent
    job: log-bug-hunter
    agent: codex
    thinking_mode: fast
# git:
#   checkout_root: ~/Workspace/public-repos
project_slug: teleclaude
