# yaml-language-server: $schema=.teleclaude/schemas/teleclaude-project.schema.json
kind: project
project_slug: teleclaude
project_name: TeleClaude
description: AI-powered multi-agent orchestration platform
company: instrukt-ai
business:
  publishes:
    - slug: general
      trigger: 'Always loaded: the platform-wide principles, policies and procedures
        every agent works under.'
    - slug: sdlc
      trigger: Writing, reviewing, testing, refactoring, or debugging code or
        tests
    - slug: creative
      trigger: Generating images, designing visuals, or producing creative or
        moodboard artifacts
    - slug: personal
      trigger: Work on a person's own mail, calendar and standing instructions.
        Only an agent started in that person's own workspace does this; asked
        elsewhere, an agent spawns one there rather than serving it.
hooks:
  inbound:
    github:
      secret: ${GITHUB_WEBHOOK_SECRET}
todos:
  store: github
  repository:
    id: 1086643517
    full_name: InstruktAI/TeleClaude
  app: 5453276
jobs:
  - name: temp-reaper
    category: system
    when:
      every: 60m
    script: jobs/temp_reaper.py
  - name: project-backup
    category: system
    when:
      at: 05:00
    script: jobs/project_backup.py
  - name: log-bug-hunter
    category: system
    when:
      every: 6h
    job: sdlc/procedure/maintenance/log-bug-hunter
    agent:
      - codex
      - claude
      - gemini
    thinking_mode: med
    enabled: ${TELECLAUDE_JOB_LOGBUGHUNTER_ENABLED}
checkpoint:
  maintenance:
    docs-layout-convergence:
      command:
        - '{interpreter}'
        - -m
        - teleclaude.entrypoints.docs_layout_convergence
      main_only: true
      precedence: 45
    blueprint:
      command:
        - '{interpreter}'
        - -c
        - pass
      main_only: true
      precedence: 50
      runs_while_serving: true
  bindings:
    - scope:
        include:
          - templates/help-desk-*/**
          - templates/home-person/**
          - templates/home-company/**
      actions:
        - sync
    - scope:
        include:
          - teleclaude/docs_layout.py
          - teleclaude/docs_layout_effects.py
          - teleclaude/snippet_roots.py
      actions:
        - docs-layout-convergence
code:
  enabled: true
docs:
  enabled: true
agents:
  enabled: true
help_desk:
  enabled: true
ci:
  required_checks:
    - .github/workflows/lint-test.yaml
  dependency_update_branches:
    - renovate/
    - dependabot/
env_allow_list: []
schema_version: 27
