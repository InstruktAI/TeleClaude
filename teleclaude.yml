# yaml-language-server: $schema=.teleclaude/schemas/teleclaude-project.schema.json
description: AI-powered multi-agent orchestration platform
project_name: TeleClaude
project_slug: teleclaude
company: instrukt-ai
help_desk:
  enabled: true
env_allow_list: []
business:
  publishes:
    - slug: general
      trigger: 'Always loaded: the platform-wide principles, policies and procedures
        every agent works under.'
    - slug: sdlc
      trigger: Writing, reviewing, testing, refactoring, or debugging code or
        tests
    - slug: creative
      trigger: Generating images, designing visuals, or producing creative or
        moodboard artifacts
    - slug: personal
      trigger: Work on a person's own mail, calendar and standing instructions.
        Only an agent started in that person's own workspace does this; asked
        elsewhere, an agent spawns one there rather than serving it.
# TeleClaude's checkpoint maintenance uses this project's overlay. The
# platform-wide base supplies sync for docs and agents and install for setup.
# This overlay adds the runtime-specific actions below.
checkpoint:
  maintenance:
    release-posture:
      main_only: true
      precedence: 5
      command:
        - '{interpreter}'
        - -m
        - teleclaude.deployment.release_checkout
        - --after-sha
        - '{after_sha}'
    plumbing-convergence:
      main_only: true
      precedence: 15
      command:
        - '{interpreter}'
        - -m
        - teleclaude.project_setup.plumbing
    restart:
      main_only: true
      precedence: 0
      command:
        - '{interpreter}'
        - -m
        - teleclaude.core.integration.daemon_window
    # Deploying the service definitions installation renders is deferred on
    # demand, so a manual run reports it instead; no scope binds it, so the
    # commit boundary never runs it.
    service-deploy:
      main_only: true
      precedence: 110
      on_demand: defer
      owed_probe:
        - '{interpreter}'
        - -m
        - teleclaude.install.service_drift
      command:
        - make
        - install
    deps:
      main_only: true
      precedence: 20
      command:
        - uv
        - sync
    # Runs after deps and tui-reload: the runtime is available and the reloaded TUI reads the stored shape.
    config-migrate:
      main_only: true
      precedence: 50
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.config.migrations
    installation-migrations:
      main_only: true
      precedence: 35
      command:
        - '{interpreter}'
        - -m
        - teleclaude.deployment.migration_runner
        - --before-sha
        - '{before_sha}'
        - --after-sha
        - '{after_sha}'
    declaration-views-discard:
      main_only: true
      precedence: 35
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.entrypoints.declaration_view
        - discard
        - --trigger
        - maintenance
    config-schemas:
      main_only: true
      precedence: 30
      command:
        - uv
        - run
        - --quiet
        - python
        - -m
        - teleclaude.core.reconciliation.config_schemas
      runs_while_serving: true
    tui-reload:
      main_only: true
      precedence: 40
      on_demand: defer
      owed_probe:
        - '{interpreter}'
        - -m
        - teleclaude.core.integration.deferred_probes
        - tui-reload
        - --tip
        - '{after_sha}'
      command:
        - '{interpreter}'
        - -m
        - teleclaude.cli.tui.processes
    docs-layout-convergence:
      main_only: true
      precedence: 45
      command:
        - '{interpreter}'
        - -m
        - teleclaude.entrypoints.docs_layout_convergence
    self-update:
      main_only: true
      command:
        - '{interpreter}'
        - -m
        - teleclaude.deployment.self_update
        - '{event_file}'
  integrator_judgment:
    - log-check
  bindings:
    # The integrator checks logs for all daemon source. There is deliberately no
    # checkpoint `code` overlay: it would bind `test`, which this project's test
    # moratorium forbids. A generic binding keeps log-check without test.
    - scope:
        include:
          - teleclaude/**/*.py
      actions:
        - log-check
    - scope:
        include:
          - pyproject.toml
          - requirements*.txt
          - uv.lock
      actions:
        - deps
    - scope:
        include:
          - teleclaude/install/**
          - teleclaude/project_setup/**
          - src/Launcher/**
          - teleclaude/hooks/adapters/**
          - templates/**
      actions:
        - install
    - scope:
        include:
          - templates/quality/githooks/**
      actions:
        - plumbing-convergence
    - scope:
        include:
          - templates/help-desk-*/**
          - templates/home-person/**
          - templates/home-company/**
      actions:
        - plumbing-convergence
        - sync
    - scope:
        include:
          - teleclaude/cli/tui/**
      actions:
        - tui-reload
    - scope:
        include:
          - teleclaude/config/**
            # The TUI reloads before the migration stores newer documents, so a reloaded
            # TUI already runs the migration list that reads them.
      actions:
        - config-migrate
        - tui-reload
    - scope:
        include:
          - teleclaude/docs_layout.py
          - teleclaude/docs_layout_effects.py
          - teleclaude/snippet_roots.py
      actions:
        - docs-layout-convergence
    - scope:
        include:
          - teleclaude/**
          - pyproject.toml
          - uv.lock
      actions:
        - declaration-views-discard
    - scope:
        include:
          - teleclaude/**/*.py
          - teleclaude/mcp/teleclaude-mcp.schema.json
      actions:
        - config-schemas
    - events:
        - github.push
        - github.release
      actions:
        - self-update
    - activation: canonical_main
      actions:
        - release-posture
        - installation-migrations
jobs:
  - category: system
    name: temp-reaper
    when:
      every: 60m
    script: jobs/temp_reaper.py
  - category: system
    name: project-backup
    when:
      at: 05:00
    script: jobs/project_backup.py
  - category: system
    name: log-bug-hunter
    when:
      every: 6h
    job: sdlc/procedure/maintenance/log-bug-hunter
    agent:
      - codex
      - claude
      - gemini
    thinking_mode: med
    enabled: ${TELECLAUDE_JOB_LOGBUGHUNTER_ENABLED}
code:
  enabled: true
docs:
  enabled: true
agents:
  enabled: true
hooks:
  inbound:
    github:
      secret: ${GITHUB_WEBHOOK_SECRET}
todos:
  repository:
    id: 1086643517
    full_name: InstruktAI/TeleClaude
  app: 5453276
kind: project
schema_version: 26
