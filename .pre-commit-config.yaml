repos:
- repo: https://github.com/commitizen-tools/commitizen
  rev: v3.14.1
  hooks:
  - id: commitizen
- repo: local
  hooks:
  - id: format
    name: Format (telec code lint --step ruff_format)
    entry: uv run python -m teleclaude.cli.telec code lint --step ruff_format
    language: system
    types: [python]
    pass_filenames: true
    require_serial: true
  - id: guardrails
    name: Guardrail enforcement (tools/lint/guardrails.py)
    entry: uv run python tools/lint/guardrails.py
    language: system
    pass_filenames: true
  - id: snapshot-testing
    name: Snapshot testing assertions (telec code lint --step snapshot_testing)
    entry: uv run python -m teleclaude.cli.telec code lint --step snapshot_testing
    language: system
    files: ^(tests/.*\.py|frontend/.*\.(ts|tsx))$
    pass_filenames: true
  - id: ruff-check
    name: Ruff check (telec code lint --step ruff_check)
    entry: uv run python -m teleclaude.cli.telec code lint --step ruff_check
    language: system
    types: [python]
    pass_filenames: true
  - id: typecheck
    name: Type checking (telec code lint --step pyright)
    entry: uv run python -m teleclaude.cli.telec code lint --step pyright
    language: system
    types: [python]
    pass_filenames: true
  - id: markdown-validate
    name: Markdown validation (tools/lint/markdown.py)
    entry: uv run python tools/lint/markdown.py
    language: system
    files: \.(md|yaml)$
    pass_filenames: false
  - id: home-paths
    name: Reject hardcoded HOME paths in docs (tools/lint/home_paths.py)
    entry: uv run python tools/lint/home_paths.py --project-root .
    language: system
    files: \.md$
    pass_filenames: false
- repo: local
  hooks:
  - id: check-cli-help
    name: Verify CLI -h exits cleanly
    entry: ./tools/checks/check-cli-help.sh
    language: system
    pass_filenames: false
    files: ^teleclaude/cli/(telec|config_cli|config_cmd)\.py$
  - id: check-raw-sql
    name: Check for raw SQL without noqa markers
    entry: ./tools/checks/check-raw-sql.sh
    language: system
    pass_filenames: false
    files: ^teleclaude/(core/db\.py|hooks/receiver/__main__\.py)$
- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt --check (Rust)
    entry: cargo fmt --all -- --check
    language: system
    files: \.rs$
    pass_filenames: false
  - id: cargo-clippy
    name: cargo clippy (Rust)
    entry: cargo clippy --workspace --all-targets -- -D warnings
    language: system
    files: (\.rs|Cargo\.toml|Cargo\.lock)$
    pass_filenames: false
  - id: cargo-test
    name: cargo test --workspace --lib (Rust unit tests)
    entry: cargo test --workspace --lib --quiet
    language: system
    files: (\.rs|Cargo\.toml|Cargo\.lock)$
    pass_filenames: false
