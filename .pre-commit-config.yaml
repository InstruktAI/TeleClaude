repos:
- repo: https://github.com/commitizen-tools/commitizen
  rev: v3.14.1
  hooks:
  - id: commitizen
- repo: local
  hooks:
  - id: format
    name: Format (telec code lint --step ruff_format)
    entry: telec code lint --step ruff_format
    language: system
    types: [python]
    pass_filenames: true
    require_serial: true
  - id: guardrails
    name: Guardrail enforcement (telec code lint --step guardrails)
    entry: telec code lint --step guardrails
    language: system
    pass_filenames: true
  - id: ruff-check
    name: Ruff check (telec code lint --step ruff_check)
    entry: telec code lint --step ruff_check
    language: system
    types: [python]
    pass_filenames: true
  - id: typecheck
    name: Type checking (telec code lint --step pyright)
    entry: telec code lint --step pyright
    language: system
    types: [python]
    pass_filenames: true
  - id: markdown-validate
    name: Markdown validation (telec code lint --step markdown)
    entry: telec code lint --step markdown
    language: system
    files: \.(md|yaml)$
    pass_filenames: false
- repo: local
  hooks:
  - id: teleclaude-docs-check
    name: Check for hardcoded HOME paths in docs
    entry: bash -c
    args:
    - 'files=$(git diff --cached --name-only --diff-filter=ACM -- "*.md"); matches=""; for f in $files; do git show ":$f" | grep -q "@/Users/|@/home/" && matches="$matches $f"; done; if [ -n "$matches" ]; then printf "%s\n" "$matches"; echo "ERROR: Hardcoded HOME paths found in docs. Run ''telec init'' to set up filters."; exit 1; fi'
    language: system
    files: \.md$
    pass_filenames: false
  - id: teleclaude-docs-validate
    name: Validate docs and artifacts
    entry: ./tools/lint/precommit-hook.sh docs-validate
    language: system
    pass_filenames: true
    files: ^(docs/|agents/|\.agents/|scripts/snippet_schema\.yaml|teleclaude/constants\.py)
  - id: check-cli-help
    name: Verify CLI -h exits cleanly
    entry: ./tools/checks/check-cli-help.sh
    language: system
    pass_filenames: false
    files: ^teleclaude/cli/(telec|config_cli|config_cmd)\.py$
  - id: check-raw-sql
    name: Check for raw SQL without noqa markers
    entry: ./tools/checks/check-raw-sql.sh
    language: system
    pass_filenames: false
    files: ^teleclaude/(core/db\.py|hooks/receiver/__main__\.py)$
