[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/observability",
    "crates/storage",
    "crates/event-bus",
    "crates/identity",
    "crates/config",
    "crates/integration",
    "crates/reconciliation",
    "crates/workflow",
    "crates/telec-cli",
    "crates/telec-daemon",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["TeleClaude contributors"]
repository = "https://github.com/InstruktAI/TeleClaude"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

# Redis
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
    "streams",
] }

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
regex = "1.11"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Config / env
dotenvy = "0.15"

# SQLite reader for migration tool
rusqlite = { version = "0.32", features = ["bundled"] }

# Workspace crates
shared = { path = "crates/shared" }
observability = { path = "crates/observability" }
storage = { path = "crates/storage" }
event-bus = { path = "crates/event-bus" }
identity = { path = "crates/identity" }
config = { path = "crates/config" }
integration = { path = "crates/integration" }
reconciliation = { path = "crates/reconciliation" }
workflow = { path = "crates/workflow" }

[workspace.lints]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
